backend:
  name: git-gateway
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "projects"
    label: "Projects"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Documentary"
          - "SaaS"
          - "Apple UI"
          - "Motion Graphics"
          - "Tutorial & How-To"
          - "Cinematic Calm Down"
          - "3D Map & Geography"
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Thumbnail", name: "thumbnail", widget: "image", required: false }
      - { label: "Google Drive URL", name: "videoUrl", widget: "string" }
      - label: "Software"
        name: "software"
        widget: "list"
        required: false
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - label: "Status"
        name: "status"
        widget: "select"
        options: ["published", "draft"]
        default: "published"
      - { label: "Order", name: "order", widget: "number", default: 0, required: false }